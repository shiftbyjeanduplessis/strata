<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>GRGL Mobile Demo</title>
<style>
:root { color-scheme: light; --bg:#eef1ec; --ink:#132017; --muted:#667269; --line:#dfe5df; --panel:#ffffff; --active:#183f2a; --accent:#dfe9dd; }
* { box-sizing:border-box; }
html,body { margin:0; min-height:100%; background:var(--bg); font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); }
body { min-height:100vh; display:grid; place-items:center; padding:20px; }
.demo-wrap { width:min(430px,100%); }
.brand { text-align:center; margin:0 0 10px; font-weight:800; letter-spacing:.02em; font-size:13px; color:#405047; }
.phone { width:100%; height:min(900px,calc(100vh - 40px)); min-height:640px; background:var(--panel); border:1px solid rgba(15,32,21,.12); border-radius:30px; box-shadow:0 22px 60px rgba(20,35,25,.17); overflow:hidden; display:flex; flex-direction:column; }
.switcher { position:relative; z-index:2; background:#fff; border-bottom:1px solid var(--line); padding:14px 14px 12px; }
.switcher-title { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.switcher-title strong { font-size:14px; }
.switcher-title span { font-size:11px; color:var(--muted); }
.segmented { display:grid; grid-template-columns:repeat(3,1fr); gap:5px; padding:4px; border-radius:14px; background:#edf1ed; }
.segmented button { appearance:none; border:0; border-radius:10px; padding:10px 6px; font:inherit; font-size:12px; font-weight:750; color:#46534b; background:transparent; cursor:pointer; transition:.18s ease; white-space:nowrap; }
.segmented button.active { background:#fff; color:var(--active); box-shadow:0 2px 8px rgba(24,63,42,.12); }
.frame-shell { flex:1; min-height:0; background:#f6f7f5; }
iframe { width:100%; height:100%; border:0; display:block; background:#fff; }
@media (max-width:520px){ body{padding:0;background:#fff;} .demo-wrap{width:100%;height:100vh;} .brand{display:none;} .phone{height:100vh;min-height:0;border:0;border-radius:0;box-shadow:none;} .switcher{padding-top:calc(10px + env(safe-area-inset-top));} }
</style>
</head>
<body>
<div class="demo-wrap">
  <div class="brand">GRGL MOBILE DEMO</div>
  <main class="phone" aria-label="GRGL mobile demo">
    <header class="switcher">
      <div class="switcher-title"><strong>View as</strong><span id="roleHint">Staff Lite</span></div>
      <nav class="segmented" aria-label="Switch mobile role">
        <button class="active" data-role="staff" aria-pressed="true">Staff</button>
        <button data-role="operations" aria-pressed="false">Operations</button>
        <button data-role="owner" aria-pressed="false">Owner</button>
      </nav>
    </header>
    <section class="frame-shell">
      <iframe id="roleFrame" title="GRGL Staff Lite" src="mobile-staff-lite.html" loading="eager"></iframe>
    </section>
  </main>
</div>
<script>
const roles={
 staff:{label:'Staff Lite',title:'GRGL Staff Lite',src:'mobile-staff-lite.html'},
 operations:{label:'Operations Mobile',title:'GRGL Operations Mobile',src:'mobile-operations.html'},
 owner:{label:'Owner Mobile',title:'GRGL Owner Mobile',src:'mobile-owner.html'}
};
const frame=document.getElementById('roleFrame');
const hint=document.getElementById('roleHint');
const buttons=[...document.querySelectorAll('[data-role]')];
function setRole(role,push=true){
 const cfg=roles[role]||roles.staff;
 buttons.forEach(b=>{const on=b.dataset.role===role;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on));});
 hint.textContent=cfg.label; frame.title=cfg.title;
 if(frame.getAttribute('src')!==cfg.src) frame.src=cfg.src;
 if(push){const u=new URL(location.href);u.searchParams.set('role',role);history.replaceState(null,'',u);}
}
buttons.forEach(b=>b.addEventListener('click',()=>setRole(b.dataset.role)));
const requested=new URL(location.href).searchParams.get('role');
if(requested&&roles[requested]) setRole(requested,false);
</script>
</body>
</html>
